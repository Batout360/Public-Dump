    <p> <marquee behavior="scroll" direction="left to right" loop="infinte" class="p">HI THERE</marquee></p>

<style>

.p{
    font-size: 20pt;
    animation-name:GG;
    animation-name: text;
    animation-timing-function: linear;
    animation-duration: 1s;
    animation-iteration-count: infinite;
}


@keyframes GG
{
    20%{color: red;}
    40%{color: blue;}
    60%{color: yellow;}
    80%{color: green;}     
}
</style>
